[workspace]
channels = ["conda-forge"]
name = "biomedagent"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.12, <3.13"
pandas = "*"
numpy = "*"

[pypi-dependencies]
# Agent / LLM (model itself runs via local Ollama, not torch)
langchain = "*"
langchain-core = "*"
langchain-ollama = "*"
langgraph = "*"
pydantic = "*"

# HTTP layer + caching
requests = "*"
requests-cache = ">=1.3.2, <2"

# Bioinformatics data sources
biopython = "*"
alphagenome = ">=0.5.1, <0.6"
atlasapprox = ">=0.2.4, <0.3"

# Misc
python-dotenv = "*"
tqdm = "*"
